<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab 4 - Eventos do rato</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Lab 4 - Eventos do rato</h1>
    </header>

    <main>
      <ol>
        <li>
          <span id="passa" onmouseover="entrar()" onmouseout="sair()"
            >Passa por aqui!</span
          >
        </li>
        <li>
          <span id="pinta">Pinta-me!</span>
          <button type="button" onclick="pintar('red')">Red</button>
          <button type="button" onclick="pintar('green')">Green</button>
          <button type="button" onclick="pintar('blue')">Blue</button>
        </li>
        <li>
          <label id="mensagem" for="cor">Escreve uma cor em inglês:</label>
          <input type="text" id="cor" oninput="pintarFundo()" />
        </li>
        <li>
          <span id="tamanho">Faz duplo clique na imagem:</span>
          <img
            id="imagem"
            src="images/java.png"
            alt="Logótipo de Java"
            ondblclick="alternarTamanho()"
          />
        </li>
        <li>
          <button type="button" onclick="contar()">Conta!</button>
          <span id="contador">0</span>
        </li>
      </ol>
    </main>

    <footer>
      <p>Lab 4 - Desenvolvimento de Interfaces Web</p>
    </footer>

    <script src="scripts/main.js"></script>
  </body>
</html>
